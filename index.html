<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profil Mahasiswa</title>
  <style>
    body {
      font-family: "Poppins", Arial, sans-serif;
      background: linear-gradient(135deg, #6dd5ed, #2193b0);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: rgba(255, 255, 255, 0.95);
      padding: 35px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
      width: 420px; /* diperbesar */
      backdrop-filter: blur(10px);
    }
    .foto {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 18px;
      border: 4px solid #fff;
      box-shadow: 0px 6px 14px rgba(0,0,0,0.25);
    }
    h2 {
      font-size: 22px;
      color: #1b4f72;
      margin-bottom: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }
    p {
      font-size: 18px;
      color: #000;
      margin: 8px 0;
      line-height: 1.6;
      font-weight: 500;
    }
    strong {
      color: #000;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="foto1.jpeg" alt="Foto Profil" class="foto" />
    <h2>UNIVERSITAS HANDAYANI MAKASSAR</h2>
    <p><strong>NIM:</strong> 2023020023</p>
    <p><strong>Prodi:</strong> Teknik Informatika</p>
    <p><strong>Asal Sekolah:</strong> SMA NEGERI 6 SERAM BAGIAN BARAT</p>
  </div>
</body>
</html>
